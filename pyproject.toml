# Repository-wide tooling configuration. Each service is packaged and deployed
# independently (see services/*/requirements.txt and Dockerfile).
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends() in argument defaults is idiomatic
    "RUF012", # mutable class attributes on pydantic/SQLAlchemy models are fine
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]
"tests/**" = ["S101", "S105", "S106", "S603"]
"shared/common/testing.py" = ["S101", "S608"]
"scripts/**" = ["S105", "T201", "S603", "S607"]  # fixed tool commands
"k8s/*.py" = ["S101", "S603", "S607", "T201"]  # cluster test/ops scripts: fixed kubectl commands

[tool.ruff.lint.isort]
known-first-party = ["app", "common", "tests"]
