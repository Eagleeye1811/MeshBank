# kind cluster simulating the "gcp" cloud: payment (stable + canary), fraud, notification.
# Non-overlapping pod/service ranges (plan: docs/kubernetes-architecture.md).
# Host ports: this cluster's service NodePorts, plus its east-west gateway on
# 32443 so the mTLS tests can attack it from the host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: meshbank-gcp
networking:
  podSubnet: 10.20.0.0/16
  serviceSubnet: 10.21.0.0/16
nodes:
  - role: control-plane
    labels:
      meshbank.io/cloud: gcp
    extraPortMappings:
      - containerPort: 30004
        hostPort: 30004
        protocol: TCP
      - containerPort: 30005
        hostPort: 30005
        protocol: TCP
      - containerPort: 30006
        hostPort: 30006
        protocol: TCP
      - containerPort: 30443
        hostPort: 32443
        protocol: TCP
