# GENERATED by scripts/generate_mesh_sidecars.py from scripts/mesh_topology.py.
# Do not edit by hand: change the topology and regenerate (make mesh-configs).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: east-west-gateway-config
  namespace: meshbank
  labels:
    meshbank.io/cluster: aws
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes 1;

    events {
        worker_connections 1024;
    }

    stream {
        resolver __KUBE_DNS__ valid=10s ipv6=off;

        log_format gateway_json escape=json '{'
            '"time":"$time_iso8601",'
            '"gateway":"aws",'
            '"client_ip":"$remote_addr",'
            '"sni":"$ssl_preread_server_name",'
            '"upstream":"$upstream_addr",'
            '"status":$status,'
            '"bytes_in":$bytes_received,'
            '"bytes_out":$bytes_sent,'
            '"session_time":$session_time'
            '}';

        access_log /dev/stdout gateway_json;
        error_log /dev/stderr warn;

        # Routable services: those gcp workloads are authorized to call. Any
        # other server name is sent to a closed port, i.e. refused. Cluster DNS
        # names outgrow the default 64-byte map bucket, so nginx would not start.
        map_hash_bucket_size 128;
        map $ssl_preread_server_name $mesh_target {
            account-service.meshbank.svc.cluster.local account-service.meshbank.svc.cluster.local:8443;
            transaction-service.meshbank.svc.cluster.local transaction-service.meshbank.svc.cluster.local:8443;
            default 127.0.0.1:1;
        }

        # TLS passthrough: read the ClientHello's SNI, forward the encrypted
        # stream. mTLS is verified end-to-end by the receiving sidecar.
        server {
            listen 15443;
            ssl_preread on;
            proxy_pass $mesh_target;
            proxy_connect_timeout 5s;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: east-west-gateway
  namespace: meshbank
  labels:
    meshbank.io/cluster: aws
    app: east-west-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: east-west-gateway
  template:
    metadata:
      labels:
        app: east-west-gateway
        meshbank.io/gateway: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: gateway
          image: nginx:alpine
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
            - >-
              ns=$(awk '/^nameserver/ {print $2; exit}' /etc/resolv.conf)
              && sed "s/__KUBE_DNS__/$ns/g" /etc/mesh/config/nginx.conf > /tmp/nginx.conf
              && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          ports:
            - name: tls-passthru
              containerPort: 15443
          volumeMounts:
            - name: config
              mountPath: /etc/mesh/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 15443
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 15443
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: east-west-gateway-config
        - name: tmp
          emptyDir: {}
---
# Reached by the gcp cluster on every node at :30443.
apiVersion: v1
kind: Service
metadata:
  name: east-west-gateway
  namespace: meshbank
  labels:
    meshbank.io/cluster: aws
spec:
  type: NodePort
  selector:
    app: east-west-gateway
  ports:
    - name: tls-passthru
      port: 15443
      targetPort: 15443
      nodePort: 30443
