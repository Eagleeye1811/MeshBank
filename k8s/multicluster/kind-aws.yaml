# kind cluster simulating the "aws" cloud: auth, account, transaction.
# Non-overlapping pod/service ranges (plan: docs/kubernetes-architecture.md).
# Host ports: this cluster's service NodePorts, plus its east-west gateway on
# 31443 so the mTLS tests can attack it from the host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: meshbank-aws
networking:
  podSubnet: 10.10.0.0/16
  serviceSubnet: 10.11.0.0/16
nodes:
  - role: control-plane
    labels:
      meshbank.io/cloud: aws
    extraPortMappings:
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP
      - containerPort: 30003
        hostPort: 30003
        protocol: TCP
      - containerPort: 30443
        hostPort: 31443
        protocol: TCP
