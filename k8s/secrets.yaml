---
# PostgreSQL superuser password (used by the postgres container only)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  namespace: meshbank
type: Opaque
stringData:
  password: "meshbank_pg_dev_superpass"
---
# Internal API token shared by all services for intra-service calls
apiVersion: v1
kind: Secret
metadata:
  name: internal-api-token
  namespace: meshbank
type: Opaque
stringData:
  token: "meshbank-dev-internal-token-change-in-prod"

