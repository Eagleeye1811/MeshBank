---
# Shared environment values used by every service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: meshbank-common
  namespace: meshbank
data:
  APP_ENV: "development"
  LOG_LEVEL: "INFO"
  JWT_PUBLIC_KEYS_DIR: "/run/meshbank/jwt-public"
  JWT_ISSUER: "meshbank-auth"
  JWT_AUDIENCE: "meshbank-api"
  HTTP_TIMEOUT_SECONDS: "5"
  DB_MIGRATION_MODE: "upgrade"
  # Service-to-service calls go to the caller's own sidecar on loopback, which
  # opens mutual TLS to the target's sidecar (see scripts/mesh_topology.py).
  ACCOUNT_SERVICE_URL: "http://127.0.0.1:9002"
  TRANSACTION_SERVICE_URL: "http://127.0.0.1:9003"
  FRAUD_SERVICE_URL: "http://127.0.0.1:9005"
  NOTIFICATION_SERVICE_URL: "http://127.0.0.1:9006"
  RECOVERY_INTERVAL_SECONDS: "30"
