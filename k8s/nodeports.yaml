---
# NodePort Services for direct host access to each banking service.
# Use these to curl from your Windows host without `kubectl port-forward`.
# NodePort 30001-30006 map to the host ports defined in kind-cluster.yaml.
apiVersion: v1
kind: Service
metadata:
  name: auth-nodeport
  labels:
    meshbank.io/workload: auth-service
  namespace: meshbank
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30001
---
