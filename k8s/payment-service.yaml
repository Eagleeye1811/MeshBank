---
# Payment Service Stable Deployment (Track: stable, Version: v1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: meshbank
  labels:
    meshbank.io/workload: payment-service
    app: payment-service-backend
    track: stable
    version: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service-backend
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: payment-service-backend
        track: stable
        version: "1"
        meshbank-sidecar: "enabled"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        # Microservice Application Container (binds to loopback 127.0.0.1:8080)
        - name: payment-service
          image: meshbank/payment-service:dev
          imagePullPolicy: Never
          args: ["uvicorn", "--factory", "app.main:create_app", "--host", "127.0.0.1", "--port", "8080", "--no-access-log"]
          ports:
            - name: loopback
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: meshbank-common
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://payment_svc:meshbank_payment_dev@postgres:5432/meshbank_payment"
            - name: PAYMENT_PROVIDER_DECLINE_PREFIX
              value: "DECLINE"
            - name: PAYMENT_PROVIDER_MAX_AMOUNT
              value: "100000.00"
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-api-token
                  key: token
          volumeMounts:
            - name: jwt-public-keys
              mountPath: /run/meshbank/jwt-public
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

        # Service Mesh Proxy Sidecar Container
        - name: mesh-sidecar
          image: nginx:alpine
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
            - >-
              ns=$(awk '/^nameserver/ {print $2; exit}' /etc/resolv.conf)
              && sed "s/__KUBE_DNS__/$ns/g" /etc/mesh/config/nginx.conf > /tmp/nginx.conf
              && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          ports:
            - name: http
              containerPort: 8004
            - name: mesh-mtls
              containerPort: 8443
            - name: metrics
              containerPort: 9102
          volumeMounts:
            - name: sidecar-config
              mountPath: /etc/mesh/config
              readOnly: true
            - name: mesh-certs
              mountPath: /etc/mesh/certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 9102
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9102
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

      volumes:
        - name: jwt-public-keys
          secret:
            secretName: jwt-public-keys
        - name: sidecar-config
          configMap:
            name: payment-sidecar-config
        - name: mesh-certs
          secret:
            secretName: payment-mesh-certs
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
# Main payment-service Service — routes to payment-router for traffic splitting
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    meshbank.io/workload: payment-service
  namespace: meshbank
spec:
  selector:
    app: payment-router
  ports:
    - name: http
      port: 8004
      targetPort: 8004
    - name: metrics
      port: 9102
      targetPort: 9102
