# Service mesh: the app listens on 127.0.0.1:8080; the mesh-sidecar container
# serves the public port, mTLS on 8443 and metrics on 9102.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  namespace: meshbank
  labels:
    meshbank.io/workload: fraud-service
    app: fraud-service
    version: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-service
  template:
    metadata:
      labels:
        app: fraud-service
        version: '1'
        meshbank-sidecar: enabled
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: fraud-service
        image: meshbank/fraud-service:dev
        imagePullPolicy: Never
        ports:
        - name: loopback
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: meshbank-common
        env:
        - name: DATABASE_URL
          value: postgresql+psycopg://fraud_svc:meshbank_fraud_dev@postgres:5432/meshbank_fraud
        - name: FRAUD_REVIEW_THRESHOLD
          value: '50000.00'
        - name: FRAUD_HARD_LIMIT
          value: '200000.00'
        - name: FRAUD_HARD_LIMIT_ACTION
          value: REJECT
        - name: FRAUD_BLOCKED_PAYEES
          value: ''
        - name: INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: internal-api-token
              key: token
        volumeMounts:
        - name: jwt-public-keys
          mountPath: /run/meshbank/jwt-public
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8005
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        args:
        - uvicorn
        - --factory
        - app.main:create_app
        - --host
        - 127.0.0.1
        - --port
        - '8080'
        - --no-access-log
      - name: mesh-sidecar
        image: nginx:alpine
        imagePullPolicy: Never
        command:
          - /bin/sh
          - -c
          - >-
            ns=$(awk '/^nameserver/ {print $2; exit}' /etc/resolv.conf)
            && sed "s/__KUBE_DNS__/$ns/g" /etc/mesh/config/nginx.conf > /tmp/nginx.conf
            && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
        ports:
        - name: http
          containerPort: 8005
        - name: mesh-mtls
          containerPort: 8443
        - name: metrics
          containerPort: 9102
        volumeMounts:
        - name: sidecar-config
          mountPath: /etc/mesh/config
          readOnly: true
        - name: mesh-certs
          mountPath: /etc/mesh/certs
          readOnly: true
        - name: sidecar-tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 9102
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 9102
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: jwt-public-keys
        secret:
          secretName: jwt-public-keys
      - name: tmp
        emptyDir: {}
      - name: data
        emptyDir: {}
      - name: sidecar-config
        configMap:
          name: fraud-sidecar-config
      - name: mesh-certs
        secret:
          secretName: fraud-mesh-certs
          defaultMode: 0440
      - name: sidecar-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-service
  labels:
    meshbank.io/workload: fraud-service
  namespace: meshbank
spec:
  selector:
    app: fraud-service
  ports:
  - name: http
    port: 8005
    targetPort: 8005
  - name: mesh-mtls
    port: 8443
    targetPort: 8443
  - name: metrics
    port: 9102
    targetPort: 9102
---
