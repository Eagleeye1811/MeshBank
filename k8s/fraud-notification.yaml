---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  namespace: meshbank
  labels:
    app: fraud-service
    version: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-service
  template:
    metadata:
      labels:
        app: fraud-service
        version: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: fraud-service
          image: meshbank/fraud-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8005
          envFrom:
            - configMapRef:
                name: meshbank-common
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://fraud_svc:meshbank_fraud_dev@postgres:5432/meshbank_fraud"
            - name: FRAUD_REVIEW_THRESHOLD
              value: "50000.00"
            - name: FRAUD_HARD_LIMIT
              value: "200000.00"
            - name: FRAUD_HARD_LIMIT_ACTION
              value: "REJECT"
            - name: FRAUD_BLOCKED_PAYEES
              value: ""
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-api-token
                  key: token
          volumeMounts:
            - name: jwt-public-keys
              mountPath: /run/meshbank/jwt-public
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: jwt-public-keys
          secret:
            secretName: jwt-public-keys
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-service
  namespace: meshbank
spec:
  selector:
    app: fraud-service
  ports:
    - name: http
      port: 8005
      targetPort: 8005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: meshbank
  labels:
    app: notification-service
    version: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        version: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: notification-service
          image: meshbank/notification-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8006
          envFrom:
            - configMapRef:
                name: meshbank-common
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://notification_svc:meshbank_notification_dev@postgres:5432/meshbank_notification"
            - name: NOTIFICATION_DELIVERY_LOG
              value: "/data/notification-deliveries.log"
            - name: NOTIFICATION_SIMULATED_FAILURE_TYPES
              value: ""
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-api-token
                  key: token
          volumeMounts:
            - name: jwt-public-keys
              mountPath: /run/meshbank/jwt-public
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8006
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: jwt-public-keys
          secret:
            secretName: jwt-public-keys
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: meshbank
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8006
      targetPort: 8006
