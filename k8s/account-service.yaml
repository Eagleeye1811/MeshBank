---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: meshbank
  labels:
    app: account-service
    version: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: account-service
        version: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: account-service
          image: meshbank/account-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: meshbank-common
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://account_svc:meshbank_account_dev@postgres:5432/meshbank_account"
            - name: DEV_SEED_ENABLED
              value: "true"
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-api-token
                  key: token
          volumeMounts:
            - name: jwt-public-keys
              mountPath: /run/meshbank/jwt-public
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: jwt-public-keys
          secret:
            secretName: jwt-public-keys
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: meshbank
spec:
  selector:
    app: account-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
